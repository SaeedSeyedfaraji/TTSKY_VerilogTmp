# Tiny Tapeout project information

project:
  title: "Interpolated Sine/Cosine Core"
  author: "Saeed Seyedfaraji"
  discord: ""
  description: "ASIC-oriented sine and cosine engine using quarter-wave symmetry, compact LUT reconstruction, and linear interpolation."
  language: "Verilog"
  clock_hz: 0

  tiles: "1x1"

  top_module: "tt_um_polytrig_core"

  source_files:
    - "tt_um_polytrig_core.v"
    - "sine_cos_lut.v"

pinout:
  # Dedicated inputs: 8-bit phase angle
  ui[0]: "phase bit 0"
  ui[1]: "phase bit 1"
  ui[2]: "phase bit 2"
  ui[3]: "phase bit 3"
  ui[4]: "phase bit 4"
  ui[5]: "phase bit 5"
  ui[6]: "phase bit 6"
  ui[7]: "phase bit 7"

  # Dedicated outputs: 8-bit unsigned sine/cosine result
  uo[0]: "result bit 0"
  uo[1]: "result bit 1"
  uo[2]: "result bit 2"
  uo[3]: "result bit 3"
  uo[4]: "result bit 4"
  uo[5]: "result bit 5"
  uo[6]: "result bit 6"
  uo[7]: "result bit 7"

  # Bidirectional pins
  uio[0]: "start input / valid output"
  uio[1]: "mode input: 0=sine, 1=cosine"
  uio[2]: "unused"
  uio[3]: "unused"
  uio[4]: "unused"
  uio[5]: "unused"
  uio[6]: "unused"
  uio[7]: "unused"

yaml_version: 6