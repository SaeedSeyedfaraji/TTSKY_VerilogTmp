# Tiny Tapeout project information
project:
  title:        "Iterative Trigonometric Core"
  author:       "Saeed Seyedfaraji"
  discord:      ""
  description:  "ASIC-oriented iterative sine and cosine engine using Taylor series expansion."
  language:     "Verilog"
  clock_hz:     0

  tiles: "1x1"

  top_module:  "tt_um_polytrig_core"

  source_files:
  - "tt_um_polytrig_core.v"
  - "sine_cos_lut.v"

pinout:
  # Inputs
  ui[0]: "input bit 0"
  ui[1]: "input bit 1"
  ui[2]: "input bit 2"
  ui[3]: "input bit 3"
  ui[4]: "input bit 4"
  ui[5]: "input bit 5"
  ui[6]: "input bit 6"
  ui[7]: "input bit 7"

  # Outputs
  uo[0]: "output bit 0"
  uo[1]: "output bit 1"
  uo[2]: "output bit 2"
  uo[3]: "output bit 3"
  uo[4]: "output bit 4"
  uo[5]: "output bit 5"
  uo[6]: "output bit 6"
  uo[7]: "output bit 7"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

yaml_version: 6